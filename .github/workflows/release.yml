name: "Plugin CI/CD"

on:
  release:
    types: [created]

permissions:
  contents: write
    
jobs:
  plugin:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Extract release notes
        shell: python
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8-sig").splitlines()
          notes = []
          matched = False
          for line in lines:
              heading = re.fullmatch(r"\[([^\]]+)\]", line.strip())
              if heading:
                  if matched:
                      break
                  matched = heading.group(1) == tag
              elif matched:
                  notes.append(line)

          if not matched:
              raise SystemExit(f"No CHANGELOG.md section found for [{tag}]")
          body = "\n".join(notes).strip()
          if not body:
              raise SystemExit(f"CHANGELOG.md section [{tag}] is empty")
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(
              body + "\n", encoding="utf-8"
          )

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x86
 
      - name: Compile plugin
        run: |
          cmake . --preset MP-Release
          cmake --build --preset MP-Release

      - name: Find plugin
        run: |
          $plugin_dll = Get-ChildItem *.dll -Recurse | Select-Object -First 1 -ExpandProperty FullName
          $plugin_dll = $plugin_dll.Replace((Resolve-Path ".").Path + "\", "")
          $plugin_dll = $plugin_dll.Replace("\", "/")
          echo "plugin_dll=$plugin_dll" >> $env:GITHUB_ENV
          echo "Found plugin path: $plugin_dll"

      - name: Upload plugin
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ env.plugin_dll }}
